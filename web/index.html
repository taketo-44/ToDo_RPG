<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS (via CDN for simplicity in template, consider build step later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div id="app" class="container mx-auto px-4 py-8 max-w-md">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                ToDo RPG
            </h1>
            <p class="text-gray-400 mt-2">Level Up Your Life</p>
        </header>

        <main id="main-content" class="relative">
            <!-- Loading State -->
            <div id="loading" class="hidden text-center py-10">
                <p class="animate-pulse text-purple-400">Loading...</p>
            </div>

            <!-- Wizard Container -->
            <div id="wizard-container" class="bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
                <div class="mb-6">
                    <div class="flex justify-between text-xs text-gray-400 mb-2">
                        <span id="step-indicator">Step 1 of 5</span>
                        <span id="step-title">Goal</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                        <div id="progress-bar" class="bg-purple-600 h-2 rounded-full transition-all duration-300"
                            style="width: 20%"></div>
                    </div>
                </div>

                <form id="wizard-form" onsubmit="return false;">
                    <!-- Step 1: Goal -->
                    <div class="wizard-step" data-step="1">
                        <label class="block text-lg font-medium mb-2">What is your long-term goal?</label>
                        <input type="text" name="long_term_goal"
                            class="w-full bg-gray-900 border border-gray-600 rounded p-3 focus:border-purple-500 focus:outline-none"
                            placeholder="e.g. Master Python, Lose 5kg">
                    </div>

                    <!-- Step 2: Baseline -->
                    <div class="wizard-step hidden" data-step="2">
                        <label class="block text-lg font-medium mb-2">Where are you starting from?</label>
                        <textarea name="baseline"
                            class="w-full bg-gray-900 border border-gray-600 rounded p-3 focus:border-purple-500 focus:outline-none"
                            rows="3" placeholder="e.g. Can write basic scripts, 75kg"></textarea>
                    </div>

                    <!-- Step 3: Deadline -->
                    <div class="wizard-step hidden" data-step="3">
                        <label class="block text-lg font-medium mb-2">When do you want to achieve this?</label>
                        <input type="date" name="deadline"
                            class="w-full bg-gray-900 border border-gray-600 rounded p-3 focus:border-purple-500 focus:outline-none">
                    </div>

                    <!-- Step 4: Time Budget -->
                    <div class="wizard-step hidden" data-step="4">
                        <label class="block text-lg font-medium mb-4">Daily Time Budget (minutes)</label>

                        <div class="mb-4">
                            <label class="block text-sm text-gray-400 mb-1">Weekdays</label>
                            <input type="number" name="daily_time_weekday"
                                class="w-full bg-gray-900 border border-gray-600 rounded p-3" value="30">
                        </div>

                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Weekends</label>
                            <input type="number" name="daily_time_weekend"
                                class="w-full bg-gray-900 border border-gray-600 rounded p-3" value="60">
                        </div>
                    </div>

                    <!-- Step 5: Review -->
                    <div class="wizard-step hidden" data-step="5">
                        <h3 class="text-xl font-bold mb-4">Review Your Quest</h3>
                        <div id="review-content" class="space-y-3 text-sm text-gray-300">
                            <!-- Populated via JS -->
                        </div>
                    </div>

                    <div class="flex justify-between mt-8">
                        <button type="button" id="btn-back"
                            class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-50 hidden">Back</button>
                        <button type="button" id="btn-next"
                            class="px-6 py-2 rounded bg-purple-600 hover:bg-purple-500 text-white font-bold ml-auto">Next</button>
                    </div>
                </form>
            </div>
        </main>

        <script src="js/wizard.js"></script>

        <footer class="mt-12 text-center text-gray-600 text-sm">
            <p>&copy; 2024 ToDo RPG</p>
        </footer>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration);
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
